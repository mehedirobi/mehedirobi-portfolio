    <meta name="theme-color" content="#0f1218" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Open Graph (also used as the fallback by X, LinkedIn, Slack, Discord, WhatsApp) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mehedi Robi Portfolio" />
    <meta property="og:title" content="Mehedi Robi | Aspiring Software Engineer" />

    <!-- X / Twitter: title, description and image fall back to the Open Graph tags -->
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Performance: start downloading the Hero portrait before JavaScript runs.
         srcset and sizes must match Hero.jsx exactly, or the browser downloads it twice. -->
    <link
      rel="preload"
      as="image"
      type="image/webp"
      href="/projects/optimized/mehedi-robi-professional-800.webp"
      imagesrcset="/projects/optimized/mehedi-robi-professional-480.webp 480w, /projects/optimized/mehedi-robi-professional-800.webp 800w"
      imagesizes="(max-width: 640px) 224px, (max-width: 1024px) 256px, (max-width: 1280px) 320px, 352px"
      fetchpriority="high"
    />

      {

            "jobTitle": "Aspiring Software Engineer",
            "description": "Software engineering-focused developer with hands-on experience building frontend and full-stack web applications with React, Node.js, Express, and MongoDB.",
            "address": {

              "addressLocality": "Dhaka",

              "JavaScript",

            "sameAs": [
              "https://github.com/mehedirobi",
              "https://www.linkedin.com/in/mehedirobii/",
              "https://x.com/mehedirobii"
            ]
          }
        ]
      }
